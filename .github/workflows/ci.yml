name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Expo Doctor
        run: npm run doctor

  db-tests:
    name: RLS isolation (database)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (applies migrations)
        run: supabase start

      - name: Run database tests (tenant isolation)
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e:
    name: Maestro E2E (onboarding → deal → mark paid)
    runs-on: ubuntu-latest
    needs: [quality, db-tests]
    # Runs only when Maestro Cloud is configured; never silently "passes" as a no-op.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Maestro Cloud configuration
        id: cfg
        run: |
          if [ -n "${MAESTRO_API_KEY}" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}

      - name: Run Maestro flow on Maestro Cloud
        if: steps.cfg.outputs.configured == 'true'
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          app-file: ${{ secrets.MAESTRO_APP_FILE_URL }}
          workspace: .maestro

      - name: Maestro Cloud not configured
        if: steps.cfg.outputs.configured != 'true'
        run: echo "::notice::MAESTRO_API_KEY not set — skipping E2E. Configure Maestro Cloud to enable the onboarding→deal→mark-paid gate."

  eas-build:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    needs: [quality, db-tests]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Expo token
        run: test -n "${EXPO_TOKEN}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview binaries
        run: npx eas-cli build --platform all --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
