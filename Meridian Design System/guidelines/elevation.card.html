<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Warm jade-tinted shadows + hairline = the card look." -->
<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:26px;background:var(--bg-app);font-family:var(--font-ui);}
  .row{display:flex;gap:22px;align-items:center;}
  .b{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:96px;height:64px;background:var(--surface-card);border:1px solid var(--border-hair);border-radius:var(--r-lg);}
  .tok{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);}
</style></head><body>
<div class="row">
  <div class="b"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="tok">xs · chips</span></div>
  <div class="b"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="tok">sm · cards</span></div>
  <div class="b"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="tok">md · raised</span></div>
  <div class="b"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="tok">lg · popover</span></div>
</div>
</body></html>
