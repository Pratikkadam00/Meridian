<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="display 34 → micro 11. 16 body, never below 11." -->
<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--bg-app);color:var(--text-primary);}
  .r{display:flex;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px solid var(--line-50);}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);width:120px;flex:none;}
  .s{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;}
  .body{font-family:var(--font-ui);}
</style></head><body>
  <div class="r"><span class="tok">--fs-display 34</span><span class="s" style="font-size:34px">Hero figure</span></div>
  <div class="r"><span class="tok">--fs-title 24</span><span class="s" style="font-size:24px">Screen title</span></div>
  <div class="r"><span class="tok">--fs-h1 20</span><span class="s" style="font-size:20px">Section heading</span></div>
  <div class="r"><span class="tok">--fs-body 16</span><span class="body" style="font-size:16px">Body — the default reading size</span></div>
  <div class="r"><span class="tok">--fs-label 13</span><span class="body" style="font-size:13px;font-weight:500">Label / control text</span></div>
  <div class="r"><span class="tok">--fs-caption 12</span><span class="body" style="font-size:12px">Caption</span></div>
</body></html>
