<!-- @dsCard group="Colors" viewport="700x170" name="Warm neutrals" subtitle="Greige paper, sand surfaces, ink text — never blue-grey." -->
<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-ui);}
  .ramp{display:flex;gap:10px;}
  .sw{flex:1;border-radius:var(--r-md);padding:12px;min-height:96px;display:flex;flex-direction:column;
      justify-content:space-between;border:1px solid var(--border-hair);}
  .name{font-size:12px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:11px;opacity:.8;}
</style></head><body>
<div class="ramp">
  <div class="sw" style="background:var(--paper);color:var(--ink-700)"><span class="name">paper</span><span class="hex">#F6F5F2</span></div>
  <div class="sw" style="background:var(--sand);color:var(--ink-700)"><span class="name">sand</span><span class="hex">#EFEDE7</span></div>
  <div class="sw" style="background:var(--white);color:var(--ink-700)"><span class="name">card</span><span class="hex">#FFFFFF</span></div>
  <div class="sw" style="background:var(--line-200);color:#fff"><span class="name">border</span><span class="hex">#CFCBC1</span></div>
  <div class="sw" style="background:var(--ink-500);color:#fff"><span class="name">ink-500</span><span class="hex">#5A655F</span></div>
  <div class="sw" style="background:var(--ink-900);color:#fff"><span class="name">ink-900 · text</span><span class="hex">#16201E</span></div>
</div>
</body></html>
