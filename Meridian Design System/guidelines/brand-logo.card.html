<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:0;font-family:var(--font-ui);}
  .grid{display:grid;grid-template-columns:1fr 1fr;height:100%;}
  .cell{display:flex;align-items:center;gap:16px;padding:28px;}
  .light{background:var(--paper);}
  .dark{background:var(--jade-800);}
  .word{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-.02em;}
  svg{flex:none;}
</style></head><body>
<div class="grid">
  <div class="cell light">
    <svg width="52" height="52" viewBox="0 0 48 48" fill="none" color="#0E6E5C">
      <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="3"/>
      <line x1="6" y1="24" x2="42" y2="24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="24" y1="4" x2="24" y2="11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <circle cx="33" cy="24" r="5" fill="#E0922F"/>
    </svg>
    <span class="word" style="color:var(--ink-900)">Meridian</span>
  </div>
  <div class="cell dark">
    <svg width="52" height="52" viewBox="0 0 48 48" fill="none" color="#9CD0C1">
      <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="3"/>
      <line x1="6" y1="24" x2="42" y2="24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="24" y1="4" x2="24" y2="11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <circle cx="33" cy="24" r="5" fill="#E0922F"/>
    </svg>
    <span class="word" style="color:#ECF3F0">Meridian</span>
  </div>
</div>
</body></html>
