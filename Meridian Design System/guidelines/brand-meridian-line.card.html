<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:30px 26px;background:var(--bg-app);font-family:var(--font-ui);}
  .line{position:relative;height:2px;background:var(--line-200);margin:30px 8px;}
  .tick{position:absolute;top:-5px;width:2px;height:12px;background:var(--line-200);}
  .done{height:2px;background:var(--jade-500);position:absolute;left:0;top:0;width:46%;}
  .now{position:absolute;top:-8px;left:46%;width:18px;height:18px;border-radius:50%;background:var(--amber-500);
       border:3px solid var(--paper);box-shadow:var(--shadow-sm);transform:translateX(-50%);}
  .lab{position:absolute;top:16px;font-family:var(--font-ui);font-size:11px;color:var(--text-tertiary);transform:translateX(-50%);white-space:nowrap;}
</style></head><body>
<div class="line">
  <div class="done"></div>
  <div class="tick" style="left:0%"></div><div class="lab" style="left:0%">Booking</div>
  <div class="tick" style="left:23%"></div><div class="lab" style="left:23%">DLD / Oqood</div>
  <div class="now"></div><div class="lab" style="left:46%;color:var(--amber-700);font-weight:600">Due now · 40% build</div>
  <div class="tick" style="left:72%"></div><div class="lab" style="left:72%">Construction</div>
  <div class="tick" style="left:100%"></div><div class="lab" style="left:100%">Handover</div>
</div>
</body></html>
