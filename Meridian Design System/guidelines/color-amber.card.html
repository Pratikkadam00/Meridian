<!-- @dsCard group="Colors" viewport="700x150" name="Accent — Meridian Amber" subtitle="The single spark. Reserved for due / act-now moments." -->
<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-ui);}
  .ramp{display:flex;gap:10px;}
  .sw{flex:1;border-radius:var(--r-md);padding:12px;min-height:78px;display:flex;flex-direction:column;
      justify-content:space-between;border:1px solid var(--border-hair);}
  .name{font-size:12px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:11px;opacity:.85;}
</style></head><body>
<div class="ramp">
  <div class="sw" style="background:var(--amber-50);color:var(--amber-700)"><span class="name">50</span><span class="hex">#FBF0DA</span></div>
  <div class="sw" style="background:var(--amber-100);color:var(--amber-700)"><span class="name">100</span><span class="hex">#F6DFB1</span></div>
  <div class="sw" style="background:var(--amber-300);color:#5a3a08"><span class="name">300</span><span class="hex">#ECB45F</span></div>
  <div class="sw" style="background:var(--amber-500);color:#3a2604"><span class="name">500 · accent</span><span class="hex">#E0922F</span></div>
  <div class="sw" style="background:var(--amber-600);color:#fff"><span class="name">600 · text</span><span class="hex">#B9791A</span></div>
  <div class="sw" style="background:var(--amber-700);color:#fff"><span class="name">700</span><span class="hex">#8A5A12</span></div>
</div>
</body></html>
