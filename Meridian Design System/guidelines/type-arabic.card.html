<!-- @dsCard group="Type" viewport="700x200" name="Arabic — IBM Plex Sans Arabic (RTL)" subtitle="Full RTL. ~25% expansion headroom. Digits never reversed." -->
<!doctype html><html lang="ar"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:22px;background:var(--bg-app);font-family:var(--font-arabic);color:var(--text-primary);}
  .big{font-size:30px;font-weight:700;letter-spacing:0;}
  p{font-size:17px;line-height:1.6;color:var(--text-secondary);max-width:540px;margin:8px 0 0;}
  .row{display:flex;gap:14px;margin-top:14px;align-items:center;}
  .pill{font-family:var(--font-arabic);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--due-bg);color:var(--due-text);}
  .amt{font-family:var(--font-mono);font-weight:600;font-size:18px;color:var(--text-primary);}
  .meta{font-family:var(--font-ui);direction:ltr;text-align:left;font-size:11px;color:var(--text-tertiary);margin-top:14px;letter-spacing:.04em;}
</style></head><body dir="rtl">
<div class="big">مستحق هذا الأسبوع</div>
<p>رسوم تسجيل دائرة الأراضي مستحقة خلال ٣ أيام. حدّدها كمدفوعة بضغطة واحدة.</p>
<div class="row">
  <span class="pill">مستحق خلال ٣ أيام</span>
  <span class="amt">AED 75,000</span>
</div>
<div class="meta">IBM Plex Sans Arabic · layout mirrored · currency stays "AED" · figures stay LTR</div>
</body></html>
