<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-ui);}
  .ramp{display:flex;gap:10px;}
  .sw{flex:1;border-radius:var(--r-md);padding:12px;min-height:78px;display:flex;flex-direction:column;
      justify-content:space-between;border:1px solid var(--border-hair);}
  .name{font-size:12px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:11px;opacity:.85;}
  .star{font-size:11px;font-weight:700;}
</style></head><body>
<div class="ramp">
  <div class="sw" style="background:var(--jade-50);color:var(--jade-700)"><span class="name">50</span><span class="hex">#E7F3EF</span></div>
  <div class="sw" style="background:var(--jade-100);color:var(--jade-700)"><span class="name">100</span><span class="hex">#C9E6DD</span></div>
  <div class="sw" style="background:var(--jade-300);color:#08251f"><span class="name">300</span><span class="hex">#66B3A0</span></div>
  <div class="sw" style="background:var(--jade-500);color:#fff"><span class="name">500 · action</span><span class="hex">#0E6E5C</span><span class="star">★ brand</span></div>
  <div class="sw" style="background:var(--jade-700);color:#fff"><span class="name">700 · press</span><span class="hex">#094B3F</span></div>
  <div class="sw" style="background:var(--jade-800);color:#cfe7df"><span class="name">800 · ink</span><span class="hex">#0A2E2A</span></div>
</div>
</body></html>
