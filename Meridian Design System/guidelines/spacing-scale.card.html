<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px grid · sp-1 → sp-16 · 16–20 default rhythm" -->
<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:22px;background:var(--bg-app);font-family:var(--font-ui);color:var(--text-primary);}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .b{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .box{background:var(--jade-300);border-radius:3px;}
  .tok{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);}
</style></head><body>
<div class="row">
  <div class="b"><div class="box" style="width:4px;height:4px"></div><span class="tok">1·4</span></div>
  <div class="b"><div class="box" style="width:8px;height:8px"></div><span class="tok">2·8</span></div>
  <div class="b"><div class="box" style="width:12px;height:12px"></div><span class="tok">3·12</span></div>
  <div class="b"><div class="box" style="width:16px;height:16px"></div><span class="tok">4·16</span></div>
  <div class="b"><div class="box" style="width:24px;height:24px"></div><span class="tok">6·24</span></div>
  <div class="b"><div class="box" style="width:32px;height:32px"></div><span class="tok">8·32</span></div>
  <div class="b"><div class="box" style="width:48px;height:48px"></div><span class="tok">12·48</span></div>
  <div class="b"><div class="box" style="width:64px;height:64px"></div><span class="tok">16·64</span></div>
</div>
</body></html>
