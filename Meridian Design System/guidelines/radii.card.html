<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="xs 6 → 2xl 32, pill. Moderate & precise." -->
<!doctype html><html lang="en"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;padding:22px;background:var(--bg-app);font-family:var(--font-ui);}
  .row{display:flex;gap:14px;align-items:flex-end;}
  .b{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .box{width:72px;height:60px;background:var(--surface-card);border:1.5px solid var(--border-strong);}
  .tok{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);}
</style></head><body>
<div class="row">
  <div class="b"><div class="box" style="border-radius:var(--r-xs)"></div><span class="tok">xs · 6</span></div>
  <div class="b"><div class="box" style="border-radius:var(--r-sm)"></div><span class="tok">sm · 10</span></div>
  <div class="b"><div class="box" style="border-radius:var(--r-md)"></div><span class="tok">md · 14</span></div>
  <div class="b"><div class="box" style="border-radius:var(--r-lg)"></div><span class="tok">lg · 18</span></div>
  <div class="b"><div class="box" style="border-radius:var(--r-xl)"></div><span class="tok">xl · 24</span></div>
  <div class="b"><div class="box" style="border-radius:var(--r-2xl)"></div><span class="tok">2xl · 32</span></div>
  <div class="b"><div class="box" style="border-radius:var(--r-pill)"></div><span class="tok">pill</span></div>
</div>
</body></html>
