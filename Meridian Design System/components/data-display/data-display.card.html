<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="../../styles.css" />

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>

<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">

          <StatusPill status="atrisk">At risk</StatusPill>

      <div className="grp">
        <p className="lbl">Badge</p>
        <div className="row">
          <Badge tone="sample" soft>Sample deal</Badge>
          <Badge tone="jade" dot>9 milestones</Badge>
          <Badge tone="amber">Oqood due</Badge>
          <Badge tone="slate">Construction-linked</Badge>

            <ProgressMeter variant="payment" label="Paid to date" value={35} />
          </Card>
        </div>
      </div>
    </div>

}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
